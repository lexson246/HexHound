name: CI

# 为什么需要这个（HANDOVER §10 第 8 条：**没有 CI**）：在这个工作流出现之前，
# 测试、lint 与打包全靠人手跑，于是"最后一次跑是什么时候、跑的是哪个提交"
# 无从回答。更实际的问题是：这个项目在 Windows 上开发、在 WSL/Linux 上跑沙箱，
# **两端行为必须一致**——只有矩阵构建能把"在我机器上能过"变成可核对的事实。
#
# 三个作业的分工：
#   lint        静态检查（ruff 已经配置在 pyproject.toml 里）
#   test        两个平台跑全部单元测试（第三方依赖只用 pyproject 里声明的）
#   self-check  不需要任何 API key 的确定性自检（工具层检测能力 + 编排链路）

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同一分支的旧运行自动取消：CI 只关心最新提交的结果。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 测试必须是**完全离线**的：任何一步真去调模型或打目标都应该失败。
  # 这里把 key 清空，让"不小心依赖了真实凭据"的测试立刻暴露。
  LLM_API_KEY: ""
  LLM_PROVIDER: ""
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff check
        run: python -m ruff check src tests
      - name: Ruff format check (advisory)
        # 格式不是门禁：这个项目的注释与提示词是中文，行宽规则对它不友好。
        # 这里只报告差异，不因此让构建失败。
        continue-on-error: true
        run: python -m ruff format --check src tests

  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project + test dependencies
        # 只装 pyproject 里声明的依赖：CI 不该依赖开发机上恰好装了什么。
        # 刻意**不装 playwright**——浏览器验证层会用 skipUnless 跳过，
        # 而"没装也照样能跑"本身就是要守住的性质。
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest
      - name: Fail if any test was silently skipped for a bad reason
        # pytest 的退出码不会因为 skip 而失败，但"跳过数量突然变多"通常意味着
        # 某个可选依赖悄悄缺失、一整层测试没跑。这里给出可见的数字。
        run: python -m pytest -q -rs 2>&1 | tail -20

  self-check:
    name: self-check (no API key needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tool-layer detection self-test
        # 31 项检测能力检查，**不需要任何 API key**（用内置的确定性响应）。
        run: python examples/tool_selftest.py
      - name: End-to-end orchestration with a scripted LLM
        # SWARM_MOCK=1：走完 规划 → 并发子任务 → 补扫 → 复核 → 报告，
        # 但不调用任何真实模型（验证的是编排链路，不是模型智力）。
        env:
          SWARM_MOCK: "1"
        run: python examples/swarm_demo.py
      - name: CLI smoke test
        run: |
          python -m hexhound.cli --version
          python -m hexhound.cli providers
          python -m hexhound.cli report --run no-such-run --output /tmp/x.md || true
      - name: Verify the CLI reports a clean refusal without a provider
        # 没有配置提供商时必须**明确拒绝**，而不是悄悄用某个默认端点跑起来。
        run: |
          python -m hexhound.cli audit --target http://127.0.0.1:5000 --mode blackbox 2>&1 | tee /tmp/out.txt || true
          grep -q "还没有选择模型提供商" /tmp/out.txt
