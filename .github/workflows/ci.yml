name: CI

# 为什么需要这个（HANDOVER §10 第 8 条：**没有 CI**）：在这个工作流出现之前，
# 测试、lint 与打包全靠人手跑，于是"最后一次跑是什么时候、跑的是哪个提交"
# 无从回答。更实际的问题是：这个项目在 Windows 上开发、在 WSL/Linux 上跑沙箱，
# **两端行为必须一致**——只有矩阵构建能把"在我机器上能过"变成可核对的事实。
#
# 作业的分工：
#   lint        静态检查（ruff 已经配置在 pyproject.toml 里）
#   test        两个平台跑全部单元测试（第三方依赖只用 pyproject 里声明的）
#   gui         **显式**装上 Flask + Playwright + 浏览器，跑界面与浏览器验证层；
#               依赖缺失在这里是**失败**而不是跳过（HEXHOUND_REQUIRE_GUI=1）
#   desktop     Windows 上真的构建桌面版 exe，并校验它是窗口子系统（不弹控制台）
#   self-check  不需要任何 API key 的确定性自检（工具层检测能力 + 编排链路）

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同一分支的旧运行自动取消：CI 只关心最新提交的结果。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 测试必须是**完全离线**的：任何一步真去调模型或打目标都应该失败。
  # 这里把 key 清空，让"不小心依赖了真实凭据"的测试立刻暴露。
  LLM_API_KEY: ""
  LLM_PROVIDER: ""
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff check
        run: python -m ruff check src tests tools
      - name: Ruff format check (advisory)
        # 格式不是门禁：这个项目的注释与提示词是中文，行宽规则对它不友好。
        # 这里只报告差异，不因此让构建失败。
        continue-on-error: true
        run: python -m ruff format --check src tests

  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project + test dependencies
        # 只装 pyproject 里声明的依赖：CI 不该依赖开发机上恰好装了什么。
        # 刻意**不装 playwright**——浏览器验证层会用 skipUnless 跳过，
        # 而"没装也照样能跑"本身就是要守住的性质。
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run test suite
        # 与下面那一步同一个包装脚本：失败时把尾部输出写进 `$GITHUB_STEP_SUMMARY`
        # （Actions 原始日志需要认证，公共仓库只能读到 check run 摘要）。
        # 实测教训：只包"重跑那一步"是不够的——第一次 `Run test suite` 红在
        # Ubuntu 上时依旧没有任何可读原因。
        run: python tools/ci_rerun_report.py --pytest-args "" --label "Run test suite"
      - name: Fail if any test was silently skipped for a bad reason
        # pytest 的退出码不会因为 skip 而失败，但"跳过数量突然变多"通常意味着
        # 某个可选依赖悄悄缺失、一整层测试没跑。这里**再跑一次并打印 skip 明细**
        # （`-rs`），给出可见的数字。
        #
        # 刻意**不**接 `| tail -20`：那依赖 Git 的 coreutils 在 PATH 里
        # （GitHub 的 windows runner 恰好有，其它 Windows 环境没有）——
        # 本地 CI 执行器第一次跑就因此报 rc=1。日志长一点没关系，
        # 依赖运行器镜像的隐含工具才是问题。
        #
        # 失败时把尾部摘要写进 `$GITHUB_STEP_SUMMARY`：Actions 的**原始日志需要
        # 认证**，公共仓库上只能读到 check run 的 output.summary——不加这一步，
        # CI 红点对第三方（含下一个接手的 AI）就是"没有解释的红"。
        # 实测背景：第一次真跑 GitHub CI 时，windows/py3.12 这一步失败过，而 Actions
        # 的原始日志需要认证——公共仓库上那个红点**没有可读的解释**（原因至今未定位）。
        # 有了这个摘要，以后再红就有公开可读的原因（详见 docs/WORK-REPORT-ROUND4.md §10.3）。
        run: python tools/ci_rerun_report.py

  gui:
    name: gui (frontend + real browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + GUI dependencies
        # 刻意与 test 作业相反：这里**必须**装上 Playwright 与浏览器，
        # 因为界面层与浏览器验证层是"依赖没装就等于没测"的那一类。
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,lab]"
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Frontend smoke test (real browser, isolated settings)
        # HEXHOUND_REQUIRE_GUI=1：缺依赖/缺浏览器时**失败**，不许静默跳过。
        env:
          HEXHOUND_REQUIRE_GUI: "1"
          HEXHOUND_BROWSER: chromium
        run: python -m pytest tests/test_gui_frontend.py tests/test_xssverify.py tests/test_gui_settings.py -q -rs
      - name: Local console smoke (no window, no target, no model)
        run: python tools/smoke_gui_server.py

  desktop:
    name: desktop exe (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,lab,desktop]"
      - name: Build desktop executable
        run: python -m PyInstaller --noconfirm --clean HexHound-desktop.spec
      - name: Install it the way users get it (project root)
        run: copy dist\HexHound-desktop.exe hexhound.exe
        shell: cmd
      - name: Verify it is a windowed build (double-click must not open a console)
        # 这是"用户双击后有没有黑色控制台窗口"唯一能在 CI 里确定检查的性质：
        # PE 可选头的 Subsystem 必须等于 2（WINDOWS_GUI）。
        run: |
          python tools/check_desktop_exe.py hexhound.exe
          python tools/check_desktop_exe.py dist\HexHound-desktop.exe
      - name: Build the CLI executable as well (it must stay a console app)
        run: |
          python -m PyInstaller --noconfirm --clean HexHound.spec
          python tools/check_desktop_exe.py dist\hexhound.exe --expect-console
      - name: Packaging entry points dispatch correctly
        run: python -m pytest tests/test_packaged_entry.py -q
      - name: Desktop launch acceptance (window + config + history)
        # 需要可交互桌面会话与 WebView2 运行时；GitHub 的 windows runner 通常具备，
        # 但这一点无法在本机预先证实，因此标记为 advisory：
        # 它失败会显示出来，但不作为门禁（冒烟与打包校验已经是硬门禁）。
        continue-on-error: true
        run: python tools/verify_desktop_exe.py hexhound.exe

  self-check:
    name: self-check (no API key needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,lab]"
      - name: Start the local test lab
        run: |
          python vulnlab/app.py --host 127.0.0.1 > "$RUNNER_TEMP/hexhound-lab.log" 2>&1 &
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 --max-time 2 http://127.0.0.1:5000/ > /dev/null || { cat "$RUNNER_TEMP/hexhound-lab.log"; exit 1; }
      - name: Tool-layer detection self-test
        # 31 项检查使用上一步启动的本地靶场，不需要模型 API key。
        run: python examples/tool_selftest.py
      - name: End-to-end orchestration with a scripted LLM
        # SWARM_MOCK=1：走完 规划 → 并发子任务 → 补扫 → 复核 → 报告，
        # 但不调用任何真实模型（验证的是编排链路，不是模型智力）。
        env:
          SWARM_MOCK: "1"
        run: python examples/swarm_demo.py
      - name: CLI smoke test
        run: |
          python -m hexhound.cli --version
          python -m hexhound.cli providers
          python -m hexhound.cli report --run no-such-run --output /tmp/x.md || true
      - name: Verify the CLI reports a clean refusal without a provider
        # 没有配置提供商时必须**明确拒绝**，而不是悄悄用某个默认端点跑起来。
        run: |
          python -m hexhound.cli audit --target http://127.0.0.1:5000 --mode blackbox 2>&1 | tee /tmp/out.txt || true
          grep -q "还没有选择模型提供商" /tmp/out.txt
